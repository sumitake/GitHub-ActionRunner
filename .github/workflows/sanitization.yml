name: Sanitization
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  sanitization:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-sanitization-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Admit complete Gitleaks report upload
        id: gitleaks-report
        if: always() && !cancelled() && (steps.gitleaks.outcome == 'success' || steps.gitleaks.outcome == 'failure')
        run: python3 scripts/ci/check-report-upload.py gitleaks >>"$GITHUB_OUTPUT"
      - name: Upload Gitleaks results
        if: always() && !cancelled() && steps.gitleaks-report.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-results.sarif
          path: ${{ steps.gitleaks-report.outputs.path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Sanitize tracked source
        run: python3 scripts/sanitize_public.py --tracked
      - name: Sanitize history and metadata
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/sanitize_public.py --tracked --history
