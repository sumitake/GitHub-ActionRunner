name: Phase 3 Full Rehearsal
on:
  push:
    branches:
      - dev/codex/phase3-full-rehearsal-20260824
permissions: {}
jobs:
  phase3-full-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-phase3-full-rehearsal-${{ github.ref }}
      cancel-in-progress: true
    env:
      GOTOOLCHAIN: go1.26.6
      PARENT_COMMIT: fa018ea6279ab5a5524712c4c2ffa80eb2b697eb
    steps:
      - name: Checkout harness on current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Prove the diagnostic-only delta
        run: 'set -euo pipefail; test "$(git rev-parse HEAD^)" = "$PARENT_COMMIT"; test "$(git diff --name-only "$PARENT_COMMIT" HEAD)" = "$(printf "%s\n" ".github/workflows/phase3-full-rehearsal.yml" "tests/repository/test_workflow_policy.py")"'
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Prepare Task 6 image contexts
        run: scripts/prepare-task6-images.sh
      - name: Prepare Task 5 image contexts
        run: 'repository="$(pwd -P)"; scripts/prepare-task5-images.sh --generation "$GITHUB_RUN_ID" --ca-bundle "$repository/images/trust/build/ca-bundle.pem"'
      - name: Prepare Task 11 image context
        run: scripts/prepare-task11-images.sh --generation "$GITHUB_RUN_ID"
      - name: Run the closed release runtime gate once
        env:
          PGHAR_INTEGRATION_DOCKER: 1
          PGHAR_CHAOS_DOCKER: 1
        run: 'set -euo pipefail; source_date_epoch="$(git show -s --format=%ct HEAD)"; export SOURCE_DATE_EPOCH="$source_date_epoch"; scripts/test-controller-runtime.sh --release'
