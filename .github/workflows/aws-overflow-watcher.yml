name: AWS overflow watcher
on:
  push:
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  overflow-watcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-overflow-watcher-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Java
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openjdk-21-jre-headless
      - name: Overflow watcher tests
        run: sh infra/aws-overflow-watcher/scripts/run-tests.sh
