name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_refresh:
        description: Build the reviewed runner version repair with new SDK identities
        type: boolean
        default: false
      payload_reconstruction:
        description: Rebuild pinned qualified source with fixed Go and A/B proof
        type: boolean
        default: false
      bounded_qualification:
        description: Run only bounded offline candidate qualification
        type: boolean
        default: false
      metadata_probe:
        description: Run only bounded prospective producer metadata diagnostics
        type: boolean
        default: false
      expected_commit:
        description: Exact candidate commit (required for bounded mode)
        type: string
        default: ""
      expected_tree:
        description: Exact candidate tree (required for bounded mode)
        type: string
        default: ""
      carry_in_bytes:
        description: Conservatively measured retained task bytes, including fixed reserve
        type: string
        default: ""
permissions: {}
jobs:
  go:
    if: github.event_name != 'workflow_dispatch' || (!inputs.bounded_qualification && !inputs.metadata_probe && !inputs.payload_reconstruction && !inputs.candidate_refresh)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-go-${{ github.ref }}
      cancel-in-progress: true
    env:
      GOTOOLCHAIN: go1.26.10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check gofmt
        run: 'unformatted="$(find . -type f -name "*.go" -not -path "./.git/*" -print0 | xargs -0 gofmt -l)"; if [ -n "$unformatted" ]; then printf "%s\n" "$unformatted"; exit 1; fi'
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go test -race
        run: go test -race ./...
      - name: staticcheck
        run: go tool staticcheck ./...
      - name: govulncheck
        run: go tool govulncheck ./...

  worker:
    if: github.event_name != 'workflow_dispatch' || (!inputs.bounded_qualification && !inputs.metadata_probe && !inputs.payload_reconstruction && !inputs.candidate_refresh)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-worker-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Worker lint
        run: npm run worker:lint
      - name: Worker typecheck
        run: npm run worker:typecheck
      - name: Worker test
        run: npm run worker:test

  shell:
    if: github.event_name != 'workflow_dispatch' || (!inputs.bounded_qualification && !inputs.metadata_probe && !inputs.payload_reconstruction && !inputs.candidate_refresh)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-shell-${{ github.ref }}
      cancel-in-progress: true
    env:
      GOTOOLCHAIN: go1.26.10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: ShellCheck
        run: 'mapfile -d "" -t shell_files < <(git ls-files -z -- "*.sh"); if [ "${#shell_files[@]}" -eq 0 ]; then exit 1; fi; shellcheck --severity=warning "${shell_files[@]}"'
      - name: shfmt diff
        run: go tool shfmt -d scripts
      - name: Install Bats
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats
      - name: Bats
        run: bats tests/shell/*.bats tests/shell/qts/*.bats

  repository-metadata:
    if: github.event_name != 'workflow_dispatch' || (!inputs.bounded_qualification && !inputs.metadata_probe && !inputs.payload_reconstruction && !inputs.candidate_refresh)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-repository-metadata-${{ github.ref }}
      cancel-in-progress: true
    env:
      GOTOOLCHAIN: go1.26.10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate JSON and YAML parse
        run: 'node -e "const {parseAllDocuments} = require(''yaml''); const fs = require(''fs''); const {execSync} = require(''child_process''); const files = execSync(''git ls-files'').toString(''utf8'').split(''\n'').filter(f => /\.(json|jsonc|ya?ml)$/.test(f)); let failed = false; for (const f of files) { const text = fs.readFileSync(f, ''utf8''); const docs = parseAllDocuments(text, {strict: true}); for (const d of docs) { if (d.errors && d.errors.length) { failed = true; console.error(f + '': '' + d.errors.length + '' parse error(s)''); } } } if (failed) process.exit(1); console.log(''validated '' + files.length + '' JSON/YAML files'');"'
      - name: Schema tests
        run: npm run schema:test && npm run schema:validate
      - name: Canary observation tests
        run: npm run canary:test
      - name: actionlint
        run: go tool actionlint .github/workflows/*.yml
      - name: Docs lint
        run: npm run lint:docs
      - name: Format check
        run: npm run format:check
      - name: SPDX headers
        run: 'for f in scripts/check_workflow_policy.py scripts/ci/*.sh; do grep -q ''^# SPDX-License-Identifier: MPL-2.0$'' "$f" || { printf ''%s: missing SPDX-License-Identifier header\n'' "$f"; exit 1; }; done'
      - name: Workflow policy
        run: python3 scripts/check_workflow_policy.py .github/workflows
      - name: Repository metadata
        run: python3 scripts/check_repository_metadata.py --root .
      - name: Python unit tests
        run: find tests -name 'test_*.py' -not -path '*/__pycache__/*' | sed 's/\.py$//; s#/#.#g' | xargs python3 -m unittest -v
      - name: Sanitize public source
        run: python3 scripts/sanitize_public.py --tracked

  container:
    if: github.event_name != 'workflow_dispatch' || (!inputs.bounded_qualification && !inputs.metadata_probe && !inputs.payload_reconstruction && !inputs.candidate_refresh)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-container-${{ github.ref }}
      cancel-in-progress: true
    env:
      GOTOOLCHAIN: go1.26.10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check read-only hosted allocation accounting
        run: 'sudo /usr/bin/python3 -B scripts/release/qualify-runtime.py --check-accounting --source "$GITHUB_WORKSPACE" --retained-bootstrap-carry 3758096384 >"$RUNNER_TEMP/retained-bootstrap.json"'
      - name: Acquire exact public SDK input and verification receipt
        run: python3 -B scripts/release/fetch-retained-runner.py --accounting "$RUNNER_TEMP/retained-bootstrap.json"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Prepare Task 6 image contexts
        run: scripts/prepare-task6-images.sh
      - name: Stage verified retained app-local runner archive
        id: runner-payload
        run: 'set -euo pipefail; archive="$(python3 scripts/release/_retained_runner.py --input-directory "$GITHUB_WORKSPACE/.retained-sdk-input" --output-directory "$RUNNER_TEMP/retained-selected-runner")"; test -n "$archive"; printf "archive=%s\n" "$archive" >>"$GITHUB_OUTPUT"'
      - name: Prepare Task 5 image contexts
        env:
          REBUILT_RUNNER_ARCHIVE: ${{ steps.runner-payload.outputs.archive }}
        run: 'set -euo pipefail; test -n "$REBUILT_RUNNER_ARCHIVE"; repository="$(pwd -P)"; scripts/prepare-task5-images.sh --generation "$GITHUB_RUN_ID" --ca-bundle "$repository/images/trust/build/ca-bundle.pem" --runner-archive "$REBUILT_RUNNER_ARCHIVE"'
      - name: Prepare Task 11 image context
        run: scripts/prepare-task11-images.sh --generation "$GITHUB_RUN_ID"
      - name: Run Linux and Docker release gate
        env:
          PGHAR_CHAOS_DOCKER: "1"
          PGHAR_INTEGRATION_DOCKER: "1"
        run: scripts/test-controller-runtime.sh --docker
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: 1
          format: json
          output: trivy-fs-results.json
      - name: Admit complete Trivy report upload
        id: trivy-report
        run: python3 scripts/ci/check-report-upload.py trivy >>"$GITHUB_OUTPUT"
      - name: Upload Trivy results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-fs-results
          path: ${{ steps.trivy-report.outputs.path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  bounded-qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.bounded_qualification && !inputs.metadata_probe && !inputs.payload_reconstruction && !inputs.candidate_refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-bounded-qualification-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Run bounded offline qualification
        run: 'set -euo pipefail; pinned_go="$RUNNER_TOOL_CACHE/go/1.26.9/x64"; test -d "$pinned_go"; sudo --preserve-env=GITHUB_EVENT_NAME,GITHUB_EVENT_PATH,GITHUB_REPOSITORY,GITHUB_ACTOR,GITHUB_REF,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH,HTTP_PROXY,HTTPS_PROXY,ALL_PROXY,NO_PROXY,http_proxy,https_proxy,all_proxy,no_proxy /usr/bin/python3 scripts/release/qualify-runtime.py --host "$RUNNER_TEMP/bounded-qualification" --source "$GITHUB_WORKSPACE" --event "$GITHUB_EVENT_PATH" --go-root "$pinned_go"'
      - name: Admit bounded evidence transfer
        if: always()
        id: evidence
        run: 'set -euo pipefail; python3 scripts/release/qualify-runtime.py --check-upload "$RUNNER_TEMP/bounded-qualification/public" >>"$GITHUB_OUTPUT"'
      - name: Retain raw A and B outputs and sanitized verification evidence
        if: always() && steps.evidence.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bounded-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/bounded-qualification/public
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
          overwrite: false

      - name: Admit small qualification control evidence
        if: always()
        id: control
        run: 'set -euo pipefail; python3 scripts/release/qualify-runtime.py --check-control-upload "$RUNNER_TEMP/bounded-qualification/control" >>"$GITHUB_OUTPUT"'
      - name: Retain small qualification control evidence
        if: always() && steps.control.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bounded-qualification-control-${{ github.sha }}
          path: ${{ runner.temp }}/bounded-qualification/control
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
          overwrite: false

  metadata-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.metadata_probe && !inputs.bounded_qualification && !inputs.payload_reconstruction && !inputs.candidate_refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-metadata-probe-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Run bounded producer metadata probe
        run: 'set -euo pipefail; pinned_go="$RUNNER_TOOL_CACHE/go/1.26.9/x64"; test -d "$pinned_go"; sudo --preserve-env=GITHUB_EVENT_NAME,GITHUB_EVENT_PATH,GITHUB_REPOSITORY,GITHUB_ACTOR,GITHUB_REF,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH,HTTP_PROXY,HTTPS_PROXY,ALL_PROXY,NO_PROXY,http_proxy,https_proxy,all_proxy,no_proxy /usr/bin/python3 scripts/release/qualify-runtime.py --metadata-host "$RUNNER_TEMP/metadata-probe" --source "$GITHUB_WORKSPACE" --event "$GITHUB_EVENT_PATH" --go-root "$pinned_go"'
      - name: Admit sanitized metadata diagnostic transfer
        if: always()
        id: evidence
        run: 'set -euo pipefail; python3 scripts/release/qualify-runtime.py --check-metadata-upload "$RUNNER_TEMP/metadata-probe/public" >>"$GITHUB_OUTPUT"'
      - name: Retain sanitized structural metadata only
        if: always() && steps.evidence.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metadata-probe-${{ github.sha }}
          path: ${{ runner.temp }}/metadata-probe/public
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
          overwrite: false

  payload-reconstruction:
    if: github.event_name == 'workflow_dispatch' && inputs.payload_reconstruction && !inputs.bounded_qualification && !inputs.metadata_probe && !inputs.candidate_refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-payload-reconstruction-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout reviewed tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: tooling
      - name: Checkout unchanged qualified product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 874fcc9557166d94a97026ae7c966c99fa598fa9
          path: product
      - name: Verify reconstruction and unchanged qualification guards offline
        working-directory: tooling
        run: "python3 -B scripts/release/check-reconstruction-preparation.py"
      - name: Refresh Go under existing aggregate guard and verify A/B identities
        run: 'set -euo pipefail; sudo --preserve-env=GITHUB_EVENT_NAME,GITHUB_EVENT_PATH,GITHUB_REPOSITORY,GITHUB_ACTOR,GITHUB_REF,GITHUB_SHA,GITHUB_WORKSPACE,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH,HTTP_PROXY,HTTPS_PROXY,ALL_PROXY,NO_PROXY,http_proxy,https_proxy,all_proxy,no_proxy /usr/bin/python3 -B tooling/scripts/release/qualify-runtime.py --reconstruction-host "$RUNNER_TEMP/payload-reconstruction" --source "$GITHUB_WORKSPACE/product" --event "$GITHUB_EVENT_PATH"'
      - name: Recheck complete payload before upload under bounded read-only scope
        id: evidence
        run: 'set -euo pipefail; sudo systemd-run --scope --quiet --unit="pghar-reconstruction-verify-$GITHUB_RUN_ID" --property=CPUQuota=400% --property=CPUQuotaPeriodSec=100ms --property=MemoryMax=6174015488 --property=MemorySwapMax=0 --property=TasksMax=1024 /usr/bin/timeout --signal=TERM --kill-after=10s 120 /usr/bin/python3 -B tooling/scripts/release/qualify-runtime.py --check-reconstruction-upload "$RUNNER_TEMP/payload-reconstruction/public" | tee -a "$GITHUB_OUTPUT"'
      - name: Retain refreshed runtime subjects and provenance
        if: steps.evidence.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-patch-refresh-${{ github.run_id }}
          path: ${{ runner.temp }}/payload-reconstruction/public
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          overwrite: false

  candidate-refresh:
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_refresh && !inputs.payload_reconstruction && !inputs.bounded_qualification && !inputs.metadata_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-candidate-refresh-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout exact reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Check retained input bootstrap allocation
        env:
          RETAINED_CARRY: ${{ inputs.carry_in_bytes }}
        run: 'sudo /usr/bin/python3 -B scripts/release/qualify-runtime.py --check-accounting --source "$GITHUB_WORKSPACE" --retained-bootstrap-carry "$RETAINED_CARRY" >"$RUNNER_TEMP/retained-bootstrap.json"'
      - name: Acquire exact public SDK input and verification receipt
        run: python3 -B scripts/release/fetch-retained-runner.py --accounting "$RUNNER_TEMP/retained-bootstrap.json"
      - name: Build candidate under aggregate guard and verify final image
        run: 'set -euo pipefail; sudo --preserve-env=GITHUB_EVENT_NAME,GITHUB_EVENT_PATH,GITHUB_REPOSITORY,GITHUB_ACTOR,GITHUB_REF,GITHUB_SHA,GITHUB_WORKSPACE,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH,HTTP_PROXY,HTTPS_PROXY,ALL_PROXY,NO_PROXY,http_proxy,https_proxy,all_proxy,no_proxy /usr/bin/python3 -B scripts/release/qualify-runtime.py --candidate-refresh-host "$RUNNER_TEMP/candidate-refresh" --source "$GITHUB_WORKSPACE" --event "$GITHUB_EVENT_PATH"'
      - name: Recheck complete candidate transfer under bounded read-only scope
        id: evidence
        run: 'set -euo pipefail; sudo systemd-run --scope --quiet --unit="pghar-candidate-verify-$GITHUB_RUN_ID" --property=CPUQuota=400% --property=CPUQuotaPeriodSec=100ms --property=MemoryMax=6174015488 --property=MemorySwapMax=0 --property=TasksMax=1024 /usr/bin/timeout --signal=TERM --kill-after=10s 120 /usr/bin/python3 -B scripts/release/qualify-runtime.py --check-candidate-refresh-upload "$RUNNER_TEMP/candidate-refresh/public" | tee -a "$GITHUB_OUTPUT"'
      - name: Retain verified candidate subjects and provenance
        if: steps.evidence.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-version-refresh-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-refresh/public
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          overwrite: false
