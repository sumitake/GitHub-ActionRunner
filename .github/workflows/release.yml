name: Release
on:
  push:
    tags:
      - "v*"
permissions: {}
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref }}
      cancel-in-progress: true
    env:
      GOTOOLCHAIN: go1.26.5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Resolve release version
        id: version
        run: 'version="${GITHUB_REF_NAME#v}"; test -n "$version" || { echo "release tag must be v<version>"; exit 1; }; printf "version=%s\n" "$version" >>"$GITHUB_OUTPUT"'
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Bats
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats
      - name: Check gofmt
        run: unformatted="$(find . -type f -name '*.go' -not -path './.git/*' -print0 | xargs -0 gofmt -l)" && test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go test -race
        run: go test -race ./...
      - name: staticcheck
        run: go tool staticcheck ./...
      - name: govulncheck
        run: go tool govulncheck ./...
      - name: Worker lint
        run: npm run worker:lint
      - name: Worker typecheck
        run: npm run worker:typecheck
      - name: Worker test
        run: npm run worker:test
      - name: ShellCheck
        run: find scripts deploy -type f -name '*.sh' -print0 | xargs -0 -r shellcheck
      - name: shfmt diff
        run: go tool shfmt -d scripts
      - name: Bats
        run: bats tests/shell
      - name: Validate JSON and YAML parse
        run: 'node -e "const {parseAllDocuments} = require(''yaml''); const fs = require(''fs''); const {execSync} = require(''child_process''); const files = execSync(''git ls-files'').toString(''utf8'').split(''\n'').filter(f => /\.(json|jsonc|ya?ml)$/.test(f)); let failed = false; for (const f of files) { const text = fs.readFileSync(f, ''utf8''); const docs = parseAllDocuments(text, {strict: true}); for (const d of docs) { if (d.errors && d.errors.length) { failed = true; console.error(f + '': '' + d.errors.length + '' parse error(s)''); } } } if (failed) process.exit(1); console.log(''validated '' + files.length + '' JSON/YAML files'');"'
      - name: Schema tests
        run: npm run schema:test && npm run schema:validate
      - name: actionlint
        run: go tool actionlint .github/workflows/*.yml
      - name: Docs lint
        run: npm run lint:docs
      - name: Format check
        run: npm run format:check
      - name: SPDX headers
        run: 'for f in scripts/check_workflow_policy.py scripts/ci/*.sh; do grep -q ''^# SPDX-License-Identifier: MPL-2.0$'' "$f" || { printf ''%s: missing SPDX-License-Identifier header\n'' "$f"; exit 1; }; done'
      - name: Workflow policy
        run: python3 scripts/check_workflow_policy.py .github/workflows
      - name: Repository metadata
        run: python3 scripts/check_repository_metadata.py --root .
      - name: Python unit tests
        run: find tests -name 'test_*.py' -not -path '*/__pycache__/*' | sed 's/\.py$//; s#/#.#g' | xargs python3 -m unittest -v
      - name: Sanitize tracked source
        run: python3 scripts/sanitize_public.py --tracked
      - name: Check image manifest
        run: bash scripts/ci/check-images.sh
      - name: Trivy source scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Package source archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/release/package-source.sh "$VERSION" dist
      - name: Trivy dist scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: dist
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Sanitize archive members
        run: python3 scripts/sanitize_public.py --generated dist
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/portable-ghar-${{ steps.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Third-party license inventory
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: jq -r '["package", "version", "licenseConcluded", "licenseDeclared"], (.packages[]? | [.name, (.versionInfo // "-"), (.licenseConcluded // "-"), (.licenseDeclared // "-")]) | @tsv' "dist/portable-ghar-$VERSION.spdx.json" >"dist/portable-ghar-$VERSION.licenses.txt"
      - name: SHA-256 checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cd dist && sha256sum "portable-ghar-$VERSION.tar.gz" "portable-ghar-$VERSION.spdx.json" "portable-ghar-$VERSION.licenses.txt" >"portable-ghar-$VERSION.checksums.txt"
      - name: Attest provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/portable-ghar-${{ steps.version.outputs.version }}.*
          predicate-type: https://slsa.dev/provenance/v1
          predicate: "{}"
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "portable-ghar $VERSION" --notes "Reproducible source release with SPDX SBOM, third-party license inventory, SHA-256 checksums, and a signed provenance attestation. Releases are immutable once published." "dist/portable-ghar-$VERSION.tar.gz" "dist/portable-ghar-$VERSION.spdx.json" "dist/portable-ghar-$VERSION.licenses.txt" "dist/portable-ghar-$VERSION.checksums.txt"
