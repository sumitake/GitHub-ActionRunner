name: Vulnerability Watch
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  source-full-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-source-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout default-branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan source with the full release-gate policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"

  runner-image-fixable:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-runner-image-${{ github.ref }}
      cancel-in-progress: true
    env:
      GOTOOLCHAIN: go1.26.9
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Prepare Task 6 image contexts
        run: scripts/prepare-task6-images.sh
      - name: Prepare Task 5 image contexts
        run: 'repository="$(pwd -P)"; scripts/prepare-task5-images.sh --generation "$GITHUB_RUN_ID" --ca-bundle "$repository/images/trust/build/ca-bundle.pem"'
      - name: Build the pinned runner image
        id: runner
        run: 'set -euo pipefail; tag="portable-ghar-vuln-watch:runner"; source_epoch="$(git show -s --format=%ct HEAD)"; case "$source_epoch" in ""|*[!0-9]*|0) echo "invalid SOURCE_DATE_EPOCH" >&2; exit 1 ;; esac; SOURCE_DATE_EPOCH="$source_epoch" docker buildx build --platform linux/amd64 --no-cache --provenance=false --sbom=false --build-arg "SOURCE_DATE_EPOCH=$source_epoch" --output "type=docker,name=$tag,rewrite-timestamp=true" -f images/runner/Dockerfile images/runner; printf "ref=%s\n" "$tag" >>"$GITHUB_OUTPUT"'
      - name: Fail when a runner image CVE has a published fix
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.runner.outputs.ref }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  runner-upstream-currency:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-runner-upstream-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Observe the official runner release
        id: observe
        run: 'set -euo pipefail; out="$RUNNER_TEMP/runner-observation"; mkdir -m 700 "$out"; set +e; scripts/release/observe-runner-release.sh --current-manifest release/manifest.json --output "$out/runner-release.json"; observer_rc=$?; set -e; if [ "$observer_rc" -eq 3 ]; then printf "pinned runner %s is the latest official release\n" "$(jq -er ''.runtime.runner_release.version'' release/manifest.json)"; printf "newer=false\n" >>"$GITHUB_OUTPUT"; exit 0; fi; test "$observer_rc" -eq 0; test -f "$out/runner-release.json"; printf "newer=true\n" >>"$GITHUB_OUTPUT"'
      - name: Upload the observed runner release entry
        if: steps.observe.outputs.newer == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-release-observation
          path: ${{ runner.temp }}/runner-observation/runner-release.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: false
      - name: Fail while a newer official runner release exists
        if: steps.observe.outputs.newer == 'true'
        run: 'set -euo pipefail; observed="$RUNNER_TEMP/runner-observation/runner-release.json"; pinned="$(jq -er ''.runtime.runner_release.version'' release/manifest.json)"; latest="$(jq -er ''.version'' "$observed")"; published="$(jq -er ''.published_at'' "$observed")"; deadline="$(date -u -d "$published + 30 days" +%Y-%m-%dT%H:%M:%SZ)"; printf "Observed runtime.runner_release entry:\n"; cat "$observed"; printf "\n::error::pinned runner %s is behind official %s (published %s); GitHub stops queuing jobs to non-updating runners after %s. The entry above (also the runner-release-observation artifact) is the exact runtime.runner_release value to commit.\n" "$pinned" "$latest" "$published" "$deadline"; exit 1'
