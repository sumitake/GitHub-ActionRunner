name: Feature request
description: Suggest an idea or enhancement for Portable GHAR.
title: "[feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

        **Do not paste real logs, real configuration, real runtime state,
        hostnames, IP addresses, tokens, or any other deployment-specific
        detail into this form.** This repository and every issue on it are
        public. Use the synthetic placeholders described in
        [CONTRIBUTING.md](../../CONTRIBUTING.md) instead (for example
        `owner/repository`, `example-fleet`, `operator@example.invalid`).
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >-
        Describe the problem or gap using synthetic examples only. Do not
        paste real logs, configuration, or runtime state.
      placeholder: >-
        Use sanitized, synthetic examples (e.g. owner/repository,
        example-fleet, operator@example.invalid).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you considered and why you didn't pick them.
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Build / toolchain
        - Config schemas
        - Sanitization tooling
        - CI / workflows
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: >-
            I confirm this request contains no real logs, configuration,
            runtime state, secrets, or deployment identifiers -- synthetic
            examples only.
          required: true
