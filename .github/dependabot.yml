        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/images/network-helper"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      docker-network-helper-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/images/network-verifier"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
