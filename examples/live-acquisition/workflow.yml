name: Portable canary
run-name: Portable canary ${{ inputs.report_digest }}
on:
  workflow_dispatch:
    inputs:
      report_digest:
        description: Digest of the exact pending D2 report
        required: true
        type: string
      base_revision:
        description: Reviewed parent revision for dependency review
        required: true
        type: string
permissions: {}
jobs:
  canary:
    runs-on: example-canary
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
      attestations: write
    steps:
      - name: HTTPS checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Go
        id: go_setup
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.9
          cache: false
      - name: Execute Go
        id: go_run
        run: go run ./fixture/main.go
      - name: Set up Node
        id: node_setup
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
      - name: Execute Node
        id: node_run
        run: node fixture/index.js
      - name: Upload synthetic fixture
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-synthetic-fixture
          path: fixture/index.js
          retention-days: 1
      - name: Attest synthetic fixture
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: fixture/index.js
      - name: Generate SBOM
        id: sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: fixture
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false
          output-file: ${{ runner.temp }}/canary-sbom.spdx.json
      - name: Trivy filesystem scan
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: fixture
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1
          cache: false
      - name: Initialize CodeQL
        id: codeql_init
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          source-root: fixture
          ram: 1024
          threads: 1
      - name: Analyze CodeQL
        id: codeql_analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: portable-canary
          ram: 1024
          threads: 1
      - name: Review dependencies
        id: dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ inputs.base_revision }}
          head-ref: ${{ github.sha }}
      - name: Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
      - name: Send bounded case 15 observation
        env:
          CANARY_REPORT_DIGEST: ${{ inputs.report_digest }}
          CANARY_TOOL_OUTCOMES: ${{ steps.checkout.outcome }},${{ steps.go_setup.outcome == 'success' && steps.go_run.outcome == 'success' && 'success' || 'failure' }},${{ steps.node_setup.outcome == 'success' && steps.node_run.outcome == 'success' && 'success' || 'failure' }},${{ steps.artifact.outcome }},${{ steps.attest.outcome }},${{ steps.sbom.outcome }},${{ steps.trivy.outcome }},${{ steps.codeql_init.outcome == 'success' && steps.codeql_analyze.outcome == 'success' && 'success' || 'failure' }},${{ steps.dependencies.outcome }},${{ steps.gitleaks.outcome }}
        run: node canary/probe.mjs
